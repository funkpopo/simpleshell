<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <% if (webpackConfig.mode !== "development") { %>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none';"
    />
    <% } %>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SimpleShell</title>
    <style id="ss-startup-boot">
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: var(--color-bg-default, Canvas);
        color-scheme: dark;
      }
    </style>
  </head>
  <body class="ss-bootstrapping dark-theme" data-mui-color-scheme="dark">
    <div id="root"></div>
  </body>
</html>
